<script>

function repairJSON(t){

    }
    out+=c;i++;

function diffJSON(a,b,p=[],out=[]){

function flatten(v,p='',o={}){

function toYAML(v,ind=0){

function toCSV(v){

function toTS(v,name='Root'){

}
// ---------- wiring ----------
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;curView=b.dataset.v;
  [...$('tabs').children].forEach(x=>x.setAttribute('aria-selected',x===b));
  try{history.replaceState(null,'','#'+curView)}catch(_){}
  renderTools();renderView()});
let tm;src.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem('plainjson.src',src.value)}catch(e){}refresh()},180)});
function pos(){const pre=src.value.slice(0,src.selectionStart).split('\n');$('pos').textContent='Ln '+pre.length+', Col '+(pre[pre.length-1].length+1)}
['keyup','click','focus'].forEach(ev=>src.addEventListener(ev,pos));
src.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();$('bFormat').click()}
  if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'  ')}
});
function need(){parse();if(!valid){toast(lastErr?'Fix the error first, or try Repair':'Nothing to format');return false}return true}
$('bFormat').onclick=()=>{if(need())setSrc(fmt(data))};
$('bMin').onclick=()=>{if(need())setSrc(JSON.stringify(data))};
$('bSort').onclick=()=>{if(need())setSrc(fmt(sortKeys(data)))};
$('bFix').onclick=()=>{try{const r=JSON.parse(repairJSON(src.value));setSrc(fmt(r));toast('Repaired')}catch(e){toast('Could not repair: '+e.message)}};
$('bEsc').onclick=()=>{try{let v=JSON.parse(src.value);for(let i=0;i<3&&typeof v==='string';i++)v=JSON.parse(v);if(typeof v==='string')throw new Error('not JSON inside');setSrc(fmt(v));toast('Unescaped')}catch(e){toast('Input is not an escaped JSON string')}};
$('indent').onchange=()=>{try{localStorage.setItem('plainjson.indent',$('indent').value)}catch(e){}if(valid)setSrc(fmt(data))};
$('bCopy').onclick=()=>copy(src.value);
$('bClear').onclick=()=>{setSrc('');src.focus()};
$('bSample').onclick=()=>setSrc(fmt(SAMPLE));
$('bOpen').onclick=()=>$('file').click();
function loadFile(f){if(!f)return;const r=new FileReader();r.onload=()=>setSrc(String(r.result));r.readAsText(f)}
$('file').onchange=e=>loadFile(e.target.files[0]);
['dragover','dragenter'].forEach(ev=>src.addEventListener(ev,e=>{e.preventDefault();src.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>src.addEventListener(ev,e=>{e.preventDefault();src.classList.remove('drag');if(ev==='drop')loadFile(e.dataTransfer.files[0])}));
$('bTheme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('plainjson.theme',r.dataset.theme)}catch(e){}};
(function init(){
  let saved='',ind='',th='';
  try{saved=localStorage.getItem('plainjson.src')||'';ind=localStorage.getItem('plainjson.indent')||'';th=localStorage.getItem('plainjson.theme')||''}catch(e){}
  try{const ly=localStorage.getItem('plainjson.layout');if(ly)ui.layout=ly}catch(e){}
  if(ind)$('indent').value=ind;if(th)document.documentElement.dataset.theme=th;
  const h=(location.hash||'').slice(1);
  if(['tree','table','query','diff','convert','stats'].includes(h)){curView=h;[...$('tabs').children].forEach(x=>x.setAttribute('aria-selected',x.dataset.v===h))}
  src.value=saved||fmt(SAMPLE);
  renderTools();refresh();pos();
})();
</script>

</body></html>
