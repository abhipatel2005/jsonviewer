/* Layout: toolbar on top, two panes (input left, result views right), status bar below. Stacks on phones. */
:root{
  --bg:#f3f4f1; --panel:#fbfbf9; --line:#d9dcd5; --fg:#1d2321; --muted:#64706b;
  --accent:#0d6b66; --accent-fg:#ffffff; --hover:#e7eae4;
  --k:#0d5d8f; --s:#3a7a2a; --n:#b0561a; --b:#8a3fa0; --nul:#8a8f8c;
  --err:#b3261e; --err-bg:#fbe9e7; --add:#dff3df; --del:#fbe3e0; --chg:#fff2cc;
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141817; --panel:#1b201e; --line:#2f3733; --fg:#e2e7e4; --muted:#8c9893;
  --accent:#4fc3b8; --accent-fg:#0b1412; --hover:#262d2a;
  --k:#7cc0ee; --s:#9ccf86; --n:#f0a56b; --b:#d39be6; --nul:#7d8581;
  --err:#ff8a80; --err-bg:#3a1f1d; --add:#1f3a22; --del:#431f1c; --chg:#40371a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141817; --panel:#1b201e; --line:#2f3733; --fg:#e2e7e4; --muted:#8c9893;
  --accent:#4fc3b8; --accent-fg:#0b1412; --hover:#262d2a;
  --k:#7cc0ee; --s:#9ccf86; --n:#f0a56b; --b:#d39be6; --nul:#7d8581;
  --err:#ff8a80; --err-bg:#3a1f1d; --add:#1f3a22; --del:#431f1c; --chg:#40371a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;display:flex;flex-direction:column;gap:10px;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
button.primary:hover{filter:brightness(1.08)}
button[aria-pressed="true"],button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],input[type=search],select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
header.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.brand{font-weight:600;font-size:16px;margin-right:6px;display:flex;align-items:center;gap:9px}
.brand svg{width:30px;height:30px;flex:none;display:block}
.brand small{font:400 11px var(--mono);color:var(--muted)}
.grp{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.grp+.grp{padding-left:8px;border-left:1px solid var(--line)}
.spacer{flex:1}
main{flex:1;min-height:0;display:flex}
.pane{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.pane>.hd{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pane .t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:auto}
textarea.code{flex:1;min-height:0;width:100%;border:0;resize:none;background:transparent;font:13px/1.5 var(--mono);padding:10px;outline:none;white-space:pre;overflow:auto;tab-size:2}
textarea.code.drag{background:var(--hover)}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border-color:transparent;background:transparent;padding:4px 9px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.view{flex:1;min-height:0;overflow:auto;padding:8px 10px;font:13px/1.55 var(--mono)}
.view.ui{font-family:var(--ui)}
.row{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tw{font:12px var(--mono);color:var(--muted)}
/* tree */
.node{white-space:pre-wrap;word-break:break-word}
.node .ln{display:block;border-radius:3px;padding-left:2px}
.node .ln:hover{background:var(--hover)}
.node .kids{margin-left:1.3em;border-left:1px dotted var(--line);padding-left:.4em}
.tg{display:inline-block;width:1.1em;cursor:pointer;color:var(--muted);user-select:none;text-align:center}
.kk{color:var(--k);cursor:pointer}.vs{color:var(--s)}.vn{color:var(--n)}.vb{color:var(--b)}.vz{color:var(--nul)}
.cnt{color:var(--muted);font-size:11px;margin-left:.5em}
.collapsed>.kids{display:none}.collapsed>.ln .ell{display:inline}
.ell{display:none;color:var(--muted)}
mark{background:var(--chg);color:inherit;border-radius:2px;outline:1px solid var(--accent)}
.sel>.ln{background:var(--hover);outline:1px solid var(--accent)}
/* table */
table{border-collapse:collapse;font:12.5px var(--mono)}
th,td{border:1px solid var(--line);padding:3px 8px;text-align:left;vertical-align:top;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th{position:sticky;top:-8px;background:var(--panel);cursor:pointer;user-select:none}
th:hover{background:var(--hover)}
td.num{text-align:right;color:var(--n)}
/* diff */
.dl{padding:1px 8px;white-space:pre-wrap;word-break:break-word;border-radius:2px}
.dl.add{background:var(--add)}.dl.del{background:var(--del)}.dl.chg{background:var(--chg)}
.empty{color:var(--muted);padding:20px;text-align:center;font-family:var(--ui)}
pre.out{margin:0;white-space:pre-wrap;word-break:break-word}
.status{display:flex;gap:14px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted);align-items:center;min-height:20px}
.status .err{color:var(--err);background:var(--err-bg);padding:2px 8px;border-radius:4px;cursor:pointer}
.status .ok{color:var(--accent)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 12px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:640px){header.bar{justify-content:flex-start}.spacer{display:none}.brand{flex:1 1 auto;order:1}#bCopy{order:2}.menuwrap{order:3}header.bar>.grp{order:4;flex:1 1 100%;flex-wrap:nowrap}header.bar>.grp button{flex:1 1 0;padding:5px 4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* key / value layout */
.view{container-type:inline-size}
.ix{color:var(--muted);margin-right:.2em}
.tbadge,.pv{display:none;color:var(--muted)}
.view.kv{--kw:clamp(11em,34cqw,26em)}
.kv .ln:not(.close){display:flex;align-items:baseline;gap:.8em;padding:2px 4px;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent)}
.kv .kc{flex:0 0 max(7em,calc(var(--kw) - var(--d,0)*(1.7em + 1px)));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv .vc{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.kv .cl,.kv .cm,.kv .close,.kv .br,.kv .ell{display:none!important}
.kv .ix{color:var(--k);margin-right:0}
.kv .node>.ln .kk,.kv .node>.ln .ix{font-weight:500}
.kv .tbadge{display:inline;margin-right:.5em}
.kv .cnt{margin-left:0}
.kv .collapsed>.ln .pv{display:inline;margin-left:.6em}
.node.sel>.ln{background:color-mix(in srgb,var(--accent) 16%,transparent);outline:none;box-shadow:inset 2px 0 0 var(--accent)}
.crumbs{display:flex;gap:6px 8px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line);font:12px var(--mono);flex-wrap:wrap}
.crumbs .cp{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:0 2px}
.crumbs button{padding:2px 8px;font-size:12px}
.cr{cursor:pointer;padding:1px 5px;border-radius:3px}.cr:hover{background:var(--hover)}
.cr:last-child{color:var(--accent);font-weight:500}.sep{color:var(--muted)}
#view:focus-visible{outline-offset:-2px}

/* single pane: editor or one result view */
#pane[data-mode="edit"] #tools,#pane[data-mode="edit"] #view{display:none}
#pane:not([data-mode="edit"]):not([data-mode="diff"]) .eds{display:none}
.menuwrap{position:relative}
#bMore{font-size:18px;line-height:1;padding:3px 10px}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;z-index:20;display:flex;flex-direction:column;gap:1px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.menu button{border-color:transparent;background:transparent;text-align:left;border-radius:5px}
.menu button:hover{background:var(--hover)}
.menu .mh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 8px 2px}
.menu .mh:first-child{padding-top:2px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 8px}
.rt{display:none}.kv .rt{display:inline;color:var(--muted);font-style:italic}
.menu{max-width:calc(100vw - 32px)}

/* editors: one in edit mode, two side by side in compare mode */
.eds{flex:1;min-height:0;display:flex}
.ed{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.ehd{display:none;gap:8px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);font-size:12px;min-width:0}
.ehd .t{margin-right:0}
.ehd .est{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px var(--mono);color:var(--muted)}
.est.ok{color:var(--accent)}.est.bad{color:var(--err)}
.mini{padding:2px 8px;font-size:12px}
#ed2{display:none}
#pane[data-mode="diff"] .eds{flex:0 0 44%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--line)}
#pane[data-mode="diff"] #ed2{display:flex;border-left:1px solid var(--line)}
#pane[data-mode="diff"] .ehd{display:flex}
@media (max-width:700px){
  #pane[data-mode="diff"]{overflow:auto}
  #pane[data-mode="diff"] .eds{flex:none;grid-template-columns:minmax(0,1fr)}
  #pane[data-mode="diff"] .ed{height:190px}
  #pane[data-mode="diff"] #ed2{border-left:0;border-top:1px solid var(--line)}
  #pane[data-mode="diff"] .view{flex:none;min-height:260px}
}
textarea.code.wrap{white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:hidden}
.menu button[aria-pressed]{background:transparent;color:inherit}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><svg role="img" aria-label="Curly Braces logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0d6b66"/><path d="M13.5 30A8.5 8.5 0 0 0 22 38.5H26.5A5.5 5.5 0 0 1 32 44A5.5 5.5 0 0 1 37.5 38.5H42A8.5 8.5 0 0 0 50.5 30" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="21" r="4.2" fill="#9fe3d8"/><circle cx="42" cy="21" r="4.2" fill="#9fe3d8"/></svg><span class="bn">Curly Braces</span></div>
  <span class="spacer"></span>
  <div class="grp">
    <button class="primary" id="bFormat" title="Format (Ctrl+Enter)">Format</button>
    <button id="bMin" title="Minify">Minify</button>
    <button id="bEsc" title="Parse escaped JSON stored inside strings, at every level">Unescape</button>
    <button id="bTree" aria-pressed="false" title="Browse as a tree">Tree view</button>
    <button id="bCmp" aria-pressed="false" title="Compare two JSON documents side by side">Compare</button>
  </div>
  <button id="bCopy" title="Copy the input text">Copy</button>
  <div class="menuwrap">
    <button id="bMore" aria-haspopup="menu" aria-expanded="false" aria-label="More tools" title="More tools">⋯</button>
    <div class="menu" id="menu" role="menu" hidden>
      <div class="mh">View as</div>
      <button role="menuitem" data-go="table">Table</button>
      <button role="menuitem" data-go="query">Query</button>
      <button role="menuitem" data-go="convert">Convert</button>
      <button role="menuitem" data-go="stats">Stats</button>
      <div class="mh">Fix text</div>
      <button role="menuitem" id="bFix" title="Fix single quotes, trailing commas, comments, unquoted keys">Repair</button>
      <button role="menuitem" id="bSort">Sort keys</button>
      <div class="mh">File</div>
      <button role="menuitem" id="bOpen">Open file</button>
      <button role="menuitem" id="bClear">Clear</button>
      <div class="mh">Settings</div>
      <label class="mrow">Indent <select id="indent" aria-label="Indent"><option value="2">2 spaces</option><option value="4">4 spaces</option><option value="tab">Tab</option></select></label>
      <button role="menuitem" id="bWrap" aria-pressed="true">Wrap long lines: on</button>
      <button role="menuitem" id="bTheme">Switch theme</button>
    </div>
  </div>
  <input type="file" id="file" accept=".json,.txt,application/json" hidden>
</header>
<main>
  <section class="pane" id="pane" data-mode="edit">
    <div class="hd">
      <button id="bBack" hidden>← Editor</button>
      <span class="t" id="ptitle">Editor</span>
      <span class="tw" id="pos">Ln 1, Col 1</span>
    </div>
    <div class="eds" id="eds">
      <div class="ed" id="ed1">
        <div class="ehd"><span class="t">Original</span><span class="est" id="est1"></span><span class="tw" id="pos1"></span><button class="mini" data-fmt="src">Format</button></div>
        <textarea id="src" class="code" spellcheck="false" placeholder="Paste JSON here, drop a .json file, or use ⋯ → Open file"></textarea>
      </div>
      <div class="ed" id="ed2">
        <div class="ehd"><span class="t">Changed</span><span class="est" id="est2"></span><span class="tw" id="pos2"></span><button class="mini" data-fmt="src2">Format</button></div>
        <textarea id="src2" class="code" spellcheck="false" placeholder="Paste the JSON to compare against, or drop a .json file"></textarea>
      </div>
    </div>
    <div id="tools"></div>
    <div class="view" id="view"></div>
  </section>
</main>
<div class="status" id="status"></div>
<div class="toast" id="toast" role="status"></div>
<script>
// ---------- core (pure) ----------
function repairJSON(t){
  let s=t.replace(/^﻿/,'');
  let out='',i=0,n=s.length;
  while(i<n){
    const c=s[i];
    if(c==='"'||c==="'"){
      const q=c;let j=i+1,buf='';
      while(j<n&&s[j]!==q){
        if(s[j]==='\\'&&j+1<n){ if(s[j+1]==="'"){buf+="'";j+=2;continue} buf+=s[j]+s[j+1];j+=2;continue }
        if(s[j]==='"'&&q==="'"){buf+='\\"';j++;continue}
        if(s[j]==='\n'){buf+='\\n';j++;continue}
        buf+=s[j++];
      }
      out+='"'+buf+'"';i=j+1;continue;
    }
    if(c==='/'&&s[i+1]==='/'){while(i<n&&s[i]!=='\n')i++;continue}
    if(c==='/'&&s[i+1]==='*'){i=s.indexOf('*/',i+2);i=i<0?n:i+2;continue}
    if(/[A-Za-z_$]/.test(c)){
      let j=i;while(j<n&&/[\w$]/.test(s[j]))j++;
      const w=s.slice(i,j);
      if(['true','false','null'].includes(w))out+=w;
      else if(w==='undefined'||w==='NaN'||w==='Infinity')out+='null';
      else out+='"'+w+'"';
      i=j;continue;
    }
    out+=c;i++;
  }
  return out.replace(/,\s*([}\]])/g,'$1');
}
function sortKeys(v){
  if(Array.isArray(v))return v.map(sortKeys);
  if(v&&typeof v==='object'){const o={};Object.keys(v).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(k=>o[k]=sortKeys(v[k]));return o}
  return v;
}
function typeOf(v){return v===null?'null':Array.isArray(v)?'array':typeof v}
function pathStr(p){return p.reduce((a,k)=>typeof k==='number'?a+'['+k+']':(/^[A-Za-z_$][\w$]*$/.test(k)?a+'.'+k:a+'["'+k.replace(/"/g,'\\"')+'"]'),'$')}
// JSONPath subset: $ . [n] ["k"] .* [*] ..key [?(@.a op v)] [a:b]
function queryPath(root,expr){
  expr=expr.trim();if(!expr)return[];
  if(expr[0]!=='$')expr='$.'+expr;
  let cur=[{v:root,p:[]}];let i=1;
  const kids=n=>Array.isArray(n.v)?n.v.map((x,k)=>({v:x,p:n.p.concat(k)})):(n.v&&typeof n.v==='object')?Object.keys(n.v).map(k=>({v:n.v[k],p:n.p.concat(k)})):[];
  const desc=n=>{let r=[n];kids(n).forEach(c=>r=r.concat(desc(c)));return r};
  while(i<expr.length){
    if(expr.startsWith('..',i)){
      i+=2;let m=/^[\w$]+|^\*/.exec(expr.slice(i));
      if(m){const k=m[0];i+=k.length;let r=[];cur.forEach(n=>desc(n).forEach(d=>{if(k==='*')r=r.concat(kids(d));else if(d.v&&typeof d.v==='object'&&!Array.isArray(d.v)&&k in d.v)r.push({v:d.v[k],p:d.p.concat(k)})}));cur=r}
      else if(expr[i]==='['){let r=[];cur.forEach(n=>desc(n).forEach(d=>r.push(d)));cur=r}
      continue;
    }
    if(expr[i]==='.'){
      i++;const m=/^[^.\[]+/.exec(expr.slice(i));if(!m)throw new Error('Unexpected "." at '+i);
      i+=m[0].length;const k=m[0];
      cur=k==='*'?cur.flatMap(kids):cur.filter(n=>n.v&&typeof n.v==='object'&&!Array.isArray(n.v)&&k in n.v).map(n=>({v:n.v[k],p:n.p.concat(k)}));
      continue;
    }
    if(expr[i]==='['){
      const e=expr.indexOf(']',i);let depth=0,end=-1;
      for(let j=i;j<expr.length;j++){if(expr[j]==='[')depth++;else if(expr[j]===']'){depth--;if(!depth){end=j;break}}}
      if(end<0)throw new Error('Missing ]');
      const inner=expr.slice(i+1,end).trim();i=end+1;
      let m;
      if(inner==='*')cur=cur.flatMap(kids);
      else if((m=/^(-?\d+)$/.exec(inner)))cur=cur.filter(n=>Array.isArray(n.v)).map(n=>{let k=+m[1];if(k<0)k+=n.v.length;return{v:n.v[k],p:n.p.concat(k)}}).filter(x=>x.v!==undefined);
      else if((m=/^(-?\d*):(-?\d*)$/.exec(inner)))cur=cur.filter(n=>Array.isArray(n.v)).flatMap(n=>{const L=n.v.length;let a=m[1]===''?0:+m[1],b=m[2]===''?L:+m[2];if(a<0)a+=L;if(b<0)b+=L;const r=[];for(let k=Math.max(0,a);k<Math.min(L,b);k++)r.push({v:n.v[k],p:n.p.concat(k)});return r});
      else if((m=/^(["'])(.*)\1$/.exec(inner))){const k=m[2];cur=cur.filter(n=>n.v&&typeof n.v==='object'&&k in n.v).map(n=>({v:n.v[k],p:n.p.concat(k)}))}
      else if((m=/^\?\(\s*@((?:\.[\w$]+)*)\s*(==|!=|>=|<=|>|<|=~)?\s*(.*?)\s*\)$/.exec(inner))){
        const sub=m[1].split('.').filter(Boolean),op=m[2];let rv=m[3];
        if(op){if(op==='=~'){const r=/^\/(.*)\/(\w*)$/.exec(rv);rv=r?new RegExp(r[1],r[2]):new RegExp(rv)}else{try{rv=JSON.parse(rv.replace(/^'(.*)'$/,'"$1"'))}catch(e){}}}
        const test=x=>{let v=x;for(const k of sub){if(v==null||typeof v!=='object'||!(k in v))return false;v=v[k]}
          if(!op)return v!==undefined&&v!==null&&v!==false;
          switch(op){case'==':return v===rv;case'!=':return v!==rv;case'>':return v>rv;case'<':return v<rv;case'>=':return v>=rv;case'<=':return v<=rv;case'=~':return rv.test(String(v))}};
        cur=cur.flatMap(kids).filter(n=>test(n.v));
      } else throw new Error('Unsupported selector ['+inner+']');
      continue;
    }
    throw new Error('Unexpected "'+expr[i]+'" at '+i);
  }
  return cur;
}
function diffJSON(a,b,p=[],out=[]){
  const ta=typeOf(a),tb=typeOf(b);
  if(ta!==tb){out.push({k:'chg',p,a,b});return out}

  switch(ui.fmt){case'yaml':return toYAML(data);case'csv':return toCSV(data);case'ts':return toTS(data);case'min':return JSON.stringify(data);
    case'flat':return JSON.stringify(flatten(data),null,2);case'js':return 'const data = '+fmt(data).replace(/"([A-Za-z_$][\w$]*)":/g,'$1:')+';';
    case'esc':return JSON.stringify(JSON.stringify(data));case'b64':return btoa(unescape(encodeURIComponent(JSON.stringify(data))))}
}
function renderConvert(){
  let o;try{o=convertOut()}catch(e){o='Error: '+e.message}
  view.innerHTML='<pre class="out">'+esc(o)+'</pre>';view._out=o;
}
// ---------- stats ----------
function renderStats(){
  const s=stats(data);const rows=[['Size (minified)',s.bytes.toLocaleString()+' bytes'],['Size (as typed)',new Blob([src.value]).size.toLocaleString()+' bytes'],['Max depth',s.depth],['Objects',s.objects],['Arrays',s.arrays],['Keys',s.keys],['Strings',s.strings],['Numbers',s.numbers],['Booleans',s.booleans],['Nulls',s.nulls],['Longest array',s.maxArray],['Longest key',s.longestKey||'none']];
  view.className='view ui';
  view.innerHTML='<table style="font-family:var(--ui)">'+rows.map(r=>'<tr><th style="position:static;cursor:default">'+r[0]+'</th><td>'+esc(r[1])+'</td></tr>').join('')+'</table>';
}
// ---------- tools bars + dispatch ----------
function renderTools(){
  const bar=h=>{tools.innerHTML='<div class="row">'+h+'</div>'};
  const m={
   tree:()=>bar('<input type="search" id="tsearch" placeholder="Search keys and values" value="'+esc(ui.search)+'" style="flex:1 1 170px"><span class="tw" id="hits"></span><button id="tExp">Expand</button><button id="tCol">Collapse</button><button id="tL1">Level 1</button><button id="tL2">Level 2</button><span class="grp" role="group" aria-label="Layout"><button id="lyKV">Key · Value</button><button id="lyCode">Code</button></span>'),
   table:()=>bar('<input type="text" id="tpath" placeholder="Auto-detect, or path like $.store.book" value="'+esc(ui.tbl)+'" style="flex:1;min-width:140px"><input type="search" id="tsearch" placeholder="Filter rows" value="'+esc(ui.search)+'" style="width:140px"><button id="tCsv">Copy CSV</button>'),
   query:()=>bar('<input type="text" id="qin" placeholder="$.store.book[?(@.price>10)].title" value="'+esc(ui.q)+'" style="flex:1;min-width:160px"><button id="qCopy">Copy results</button><button id="qHelp" title="$ root, .key, [0], [-1], [1:3], .*, ..key, [?(@.x>5)], [?(@.name=~/ab/i)]">Syntax</button>'),
   diff:()=>bar('<button id="dSwap">Swap sides</button><button id="dCopy">Copy report</button><span class="tw">Key order is ignored</span>'),
   convert:()=>bar('<select id="cfmt"><option value="yaml">YAML</option><option value="csv">CSV</option><option value="ts">TypeScript types</option><option value="js">JS object literal</option><option value="flat">Flattened paths</option><option value="min">Minified</option><option value="esc">Escaped string</option><option value="b64">Base64</option></select><button id="cCopy">Copy output</button>'),
   stats:()=>{tools.innerHTML=''}
  };
  m[curView]();
  if(curView==='tree')tools.insertAdjacentHTML('beforeend','<div class="crumbs" id="crumbs"></div>');
  const g=id=>$(id);
  if(g('tsearch'))g('tsearch').oninput=e=>{ui.search=e.target.value;if(curView==='tree')highlight(ui.search);else renderTable()};
  if(g('lyKV')){const sync=()=>{g('lyKV').setAttribute('aria-pressed',ui.layout==='kv');g('lyCode').setAttribute('aria-pressed',ui.layout==='code')};sync();
    const set=l=>{ui.layout=l;try{localStorage.setItem('plainjson.layout',l)}catch(e){}view.classList.toggle('kv',l==='kv');sync()};g('lyKV').onclick=()=>set('kv');g('lyCode').onclick=()=>set('code')}
  if(g('tExp'))g('tExp').onclick=()=>setAll(false);
  if(g('tCol'))g('tCol').onclick=()=>setAll(true,0);
  if(g('tL1'))g('tL1').onclick=()=>setAll(true,1);
  if(g('tL2'))g('tL2').onclick=()=>setAll(true,2);
  if(g('tpath'))g('tpath').oninput=e=>{ui.tbl=e.target.value;ui.sortCol=null;renderTable()};
  if(g('tCsv'))g('tCsv').onclick=()=>{try{copy(toCSV(view._rows?view._rows.map(r=>r):data),'CSV copied')}catch(e){toast('Nothing to copy')}};
  if(g('qin'))g('qin').oninput=e=>{ui.q=e.target.value;renderQuery()};
  if(g('qCopy'))g('qCopy').onclick=()=>copy(JSON.stringify((window._q||[]).map(r=>r.v),null,2),'Results copied');
  if(g('qHelp'))g('qHelp').onclick=()=>{ui.q='$.store.book[?(@.price>10)].title';g('qin').value=ui.q;renderQuery();toast('Syntax: $ .key [0] [-1] [1:3] .* ..key [?(@.x>5)] [?(@.n=~/re/i)]')};
  if(g('dSwap'))g('dSwap').onclick=()=>{const t=src.value;src.value=src2.value;src2.value=t;try{sessionStorage.setItem('plainjson.src',src.value);localStorage.setItem('plainjson.src2',src2.value)}catch(e){}refresh();refresh2()};
  if(g('dCopy'))g('dCopy').onclick=()=>copy((window._d||[]).map(x=>(x.k==='add'?'+ ':x.k==='del'?'- ':'~ ')+pathStr(x.p)+'  '+(x.k==='chg'?JSON.stringify(x.a)+' -> '+JSON.stringify(x.b):JSON.stringify(x.k==='add'?x.b:x.a))).join('\n')||'No differences','Report copied');
  if(g('cfmt')){g('cfmt').value=ui.fmt;g('cfmt').onchange=e=>{ui.fmt=e.target.value;renderConvert()}}
  if(g('cCopy'))g('cCopy').onclick=()=>copy(view._out||'','Output copied');
}
function renderView(){
  view.className='view';
  if(!valid&&curView!=='diff'){view.innerHTML='<div class="empty">'+(lastErr?'Fix the error in the input to see results.':'Paste or open some JSON to get started.')+'</div>';return}
  ({tree:renderTree,table:renderTable,query:renderQuery,diff:renderDiff,convert:renderConvert,stats:renderStats})[curView]();
}
function refresh(){
  parse();if(mode!=='edit')renderView();
  let h='';
  if(lastErr){const p=lastErr.pos;h='<span class="err" id="goErr" title="Click to jump">'+esc(lastErr.msg)+(p&&p.line?' (line '+p.line+', col '+p.col+')':'')+'</span>'}
  else if(valid){const s=stats(data);h='<span class="ok">Valid JSON</span><span>'+s.bytes.toLocaleString()+' bytes</span><span>depth '+s.depth+'</span><span>'+s.keys+' keys</span>'}
  statusEl.innerHTML=h;
  edStatus($('est1'),valid,lastErr,!src.value.trim());
  const ge=$('goErr');if(ge)ge.onclick=()=>{const p=lastErr.pos;if(p&&p.p!=null){src.focus();src.setSelectionRange(p.p,p.p+1)}};
}
// ---------- wiring ----------
const TITLES={edit:'Editor',tree:'Tree view',table:'Table',query:'Query',diff:'Compare',convert:'Convert',stats:'Stats'};
function setMode(m,noFocus){
  mode=m;const edit=m==='edit';if(!edit)curView=m;
  $('pane').dataset.mode=m;
  $('bTree').setAttribute('aria-pressed',m==='tree');$('bCmp').setAttribute('aria-pressed',m==='diff');
  $('ptitle').textContent=TITLES[m];$('bBack').hidden=edit;$('pos').hidden=!edit;
  try{history.replaceState(null,'',edit?location.pathname+location.search:'#'+m)}catch(_){}
  if(edit){tools.innerHTML='';if(!noFocus)src.focus()}else{renderTools();if(m==='diff'){refresh();refresh2()}else renderView()}
}
function go(m){parse();if(!valid){toast(lastErr?'Fix the error first, or use Repair':'Paste some JSON first');return}setMode(m)}
function applyText(t){setSrc(t);setMode('edit')}
let tm2;src2.addEventListener('input',()=>{clearTimeout(tm2);tm2=setTimeout(()=>{try{localStorage.setItem('plainjson.src2',src2.value)}catch(e){}refresh2()},180)});
['keyup','click','focus'].forEach(ev=>src2.addEventListener(ev,()=>posOf(src2,$('pos2'))));
src2.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();fmtEd(src2)}
  if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'  ')}
});
['dragover','dragenter'].forEach(ev=>src2.addEventListener(ev,e=>{e.preventDefault();src2.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>src2.addEventListener(ev,e=>{e.preventDefault();src2.classList.remove('drag');if(ev==='drop'){const f=e.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{src2.value=String(r.result);try{localStorage.setItem('plainjson.src2',src2.value)}catch(_){}refresh2()};r.readAsText(f)}}));
function fmtEd(ta){try{const v=JSON.parse(ta.value);ta.value=fmt(v);if(ta===src)setSrc(ta.value);else{try{localStorage.setItem('plainjson.src2',ta.value)}catch(e){}refresh2()}}catch(e){toast(ta.value.trim()?(ta===src?'Fix the error first, or use Repair':'Fix the error first'):'Nothing to format')}}
document.querySelectorAll('.mini[data-fmt]').forEach(b=>b.onclick=()=>fmtEd($(b.dataset.fmt)));
$('bBack').onclick=()=>setMode('edit');
$('bCmp').onclick=()=>mode==='diff'?setMode('edit'):setMode('diff');
$('bTree').onclick=()=>mode==='tree'?setMode('edit'):go('tree');
const menu=$('menu'),more=$('bMore');
function menuOpen(o){menu.hidden=!o;more.setAttribute('aria-expanded',o)}
more.onclick=e=>{e.stopPropagation();menuOpen(menu.hidden)};
menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);menuOpen(false)});
document.addEventListener('click',e=>{if(!menu.hidden&&!e.target.closest('.menuwrap'))menuOpen(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){menuOpen(false);more.focus()}});
let tm;src.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{try{sessionStorage.setItem('plainjson.src',src.value)}catch(e){}refresh()},180)});
function posOf(ta,el){const pre=ta.value.slice(0,ta.selectionStart).split('\n');el.textContent='Ln '+pre.length+', Col '+(pre[pre.length-1].length+1)}
function pos(){posOf(src,$('pos'));posOf(src,$('pos1'))}
['keyup','click','focus'].forEach(ev=>src.addEventListener(ev,pos));
src.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();$('bFormat').click()}
  if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'  ')}
});
function need(){parse();if(!valid){toast(lastErr?'Fix the error first, or try Repair':'Nothing to format');return false}return true}
$('bFormat').onclick=()=>{if(need())applyText(fmt(data))};
$('bMin').onclick=()=>{if(need())applyText(JSON.stringify(data))};
$('bSort').onclick=()=>{if(need())applyText(fmt(sortKeys(data)))};
$('bFix').onclick=()=>{try{const r=JSON.parse(repairJSON(src.value));applyText(fmt(r));toast('Repaired')}catch(e){toast('Could not repair: '+e.message)}};
$('bEsc').onclick=()=>{try{const r=unescapeText(src.value);applyText(fmt(r.value));toast('Unescaped '+r.count+(r.count===1?' nested value':' nested values'))}catch(e){toast(e.message)}};
$('indent').onchange=()=>{try{localStorage.setItem('plainjson.indent',$('indent').value)}catch(e){}if(valid)setSrc(fmt(data))};
$('bCopy').onclick=()=>copy(src.value);
$('bClear').onclick=()=>{setSrc('');setMode('edit')};
$('bOpen').onclick=()=>$('file').click();
function loadFile(f){if(!f)return;const r=new FileReader();r.onload=()=>applyText(String(r.result));r.readAsText(f)}
$('file').onchange=e=>loadFile(e.target.files[0]);
['dragover','dragenter'].forEach(ev=>src.addEventListener(ev,e=>{e.preventDefault();src.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>src.addEventListener(ev,e=>{e.preventDefault();src.classList.remove('drag');if(ev==='drop')loadFile(e.dataTransfer.files[0])}));
function setWrap(on){[src,src2].forEach(t=>t.classList.toggle('wrap',on));$('bWrap').setAttribute('aria-pressed',on);$('bWrap').textContent='Wrap long lines: '+(on?'on':'off');try{localStorage.setItem('plainjson.wrap',on?'1':'0')}catch(e){}}
$('bWrap').onclick=()=>setWrap(!src.classList.contains('wrap'));
$('bTheme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('plainjson.theme',r.dataset.theme)}catch(e){}};
(function init(){
  let saved='',saved2='',ind='',th='';
  try{localStorage.removeItem('plainjson.src');localStorage.removeItem('plainjson.src2')}catch(e){}
  try{saved=sessionStorage.getItem('plainjson.src')||'';saved2=sessionStorage.getItem('plainjson.src2')||'';ind=localStorage.getItem('plainjson.indent')||'';th=localStorage.getItem('plainjson.theme')||''}catch(e){}
  try{const ly=localStorage.getItem('plainjson.layout');if(ly)ui.layout=ly}catch(e){}
  if(ind)$('indent').value=ind;if(th)document.documentElement.dataset.theme=th;
  let wr='1';try{wr=localStorage.getItem('plainjson.wrap')||'1'}catch(e){}
  setWrap(wr!=='0');
  const h=(location.hash||'').slice(1);
  src.value=saved;src2.value=saved2;
  refresh();refresh2();pos();
  setMode(h==='diff'||(valid&&['tree','table','query','convert','stats'].includes(h))?h:'edit',true);
})();
</script>
</body>
</html>
